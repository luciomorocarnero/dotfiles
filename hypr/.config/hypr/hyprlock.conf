$BACKGROUND_PATH = ~/Pictures/Wallpapers/pinguino.png

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = true
    immediate_render = true
}

# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    color = rgb(0, 0, 0)
    blur_passes = 2
    brightness = 0.3
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50

    outline_thickness = -1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(0, 0, 0, 0.0)
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgb(255, 255, 255)

    fade_on_empty = false
    placeholder_text =
    hide_input = false

    position = 0, 50
    halign = center
    valign = center
}

